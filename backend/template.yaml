AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: No Nut November tracker API

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: HMAC secret for login tokens. At least 16 characters.
  CorsOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: Browser origins allowed to call the API and upload images. Use * or a comma-separated list.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref CorsOrigins
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: NoNutTracker
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "nonut-proofs-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            AllowedOrigins: !Ref CorsOrigins
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireProofs
            Status: Enabled
            ExpirationInDays: 45
            Prefix: proofs/

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - src/handler.js
    Properties:
      FunctionName: nonut-api
      CodeUri: .
      Handler: src/handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          BUCKET_NAME: !Ref Bucket
          JWT_SECRET: !Ref JwtSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - S3ReadPolicy:
            BucketName: !Ref Bucket
        - S3WritePolicy:
            BucketName: !Ref Bucket
      Events:
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /login
        Board:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /board
        Uploads:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /uploads
        Entries:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /entries

Outputs:
  ApiUrl:
    Description: Set this as VITE_API_URL on the Vercel project
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  BucketName:
    Value: !Ref Bucket
  TableName:
    Value: !Ref Table
